<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05050a"><link rel="manifest" href="/manifest.json"><title>GOLD SNIPER</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05050a;color:#f5f7ff;font-family:Inter,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:900;letter-spacing:2px}.live{font-size:12px;padding:7px 10px;border:1px solid #333;border-radius:20px}.live.ok{border-color:#28d17c;color:#28d17c}.hero{margin-top:18px;padding:22px;border:1px solid #24242e;border-radius:18px;background:linear-gradient(145deg,#0b0b12,#08080d)}.label{font-size:12px;color:#9296a8}.price{font-size:clamp(42px,10vw,76px);font-weight:900;margin:5px 0}.change{font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.card{padding:16px;border:1px solid #24242e;border-radius:15px;background:#0a0a10}.value{font-size:22px;font-weight:800;margin-top:7px}.signal{font-size:28px;font-weight:900;text-transform:uppercase}.bullish{color:#28d17c}.bearish{color:#ff5364}.neutral{color:#f0c75e}.tf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.tf .card{min-height:120px}.small{font-size:11px;color:#777c8f}.error{color:#ff5364;margin-top:10px}@media(max-width:650px){.grid,.tf{grid-template-columns:1fr 1fr}.hero{padding:16px}.top{align-items:flex-start}}@media(max-width:430px){.grid,.tf{grid-template-columns:1fr}}
</style></head>
<body><main><div class="top"><div class="brand">GOLD SNIPER</div><div id="live" class="live">CONNECTING</div></div>
<section class="hero"><div class="label">XAU/USD SPOT</div><div id="price" class="price">—</div><div id="change" class="change">Waiting for spot feed…</div><div id="meta" class="small"></div></section>
<div class="grid"><div class="card"><div class="label">MARKET SIGNAL</div><div id="signal" class="signal neutral">—</div></div><div class="card"><div class="label">BID</div><div id="bid" class="value">—</div></div><div class="card"><div class="label">ASK</div><div id="ask" class="value">—</div></div><div class="card"><div class="label">DAY LOW</div><div id="low" class="value">—</div></div><div class="card"><div class="label">DAY HIGH</div><div id="high" class="value">—</div></div><div class="card"><div class="label">ACTIVE TRADES</div><div id="active" class="value">—</div></div></div>
<h3>TIMEFRAME SIGNALS</h3><div id="tfs" class="tf"></div><div id="error" class="error"></div></main>
<script>
const API='https://schegpkwfwkgfmmpnzic.supabase.co/functions/v1/dashboard-data';
const $=id=>document.getElementById(id); const n=x=>typeof x==='number'?x.toFixed(2):'—';
async function load(){try{const r=await fetch(API,{cache:'no-store'});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Feed unavailable');
$('price').textContent=n(d.price);const pct=n(d.changePct);$('change').textContent=`${d.change>=0?'+':''}${n(d.change)} (${d.change>=0?'+':''}${pct}%)`; $('change').className='change '+(d.change>=0?'bullish':'bearish');
$('bid').textContent=n(d.bid);$('ask').textContent=n(d.ask);$('low').textContent=n(d.dayLow);$('high').textContent=n(d.dayHigh);$('active').textContent=d.activeCount??0;
$('signal').textContent=d.overallSignal||'neutral';$('signal').className='signal '+(d.overallSignal||'neutral');$('meta').textContent=`Spot feed: ${d.spotProvider||'GoldAPI.io'} · Updated ${new Date(d.spotFetchedAt||d.timestamp).toLocaleTimeString()}`;
$('live').textContent=d.stale?'STALE':'LIVE';$('live').className='live '+(d.stale?'':'ok');$('error').textContent='';
$('tfs').innerHTML=(d.allTimeframes||[]).map(t=>`<div class="card"><div class="label">${t.timeframe}</div><div class="value ${t.direction==='long'?'bullish':t.direction==='short'?'bearish':'neutral'}">${t.status}</div><div class="small">${t.direction||'No active direction'}${t.entry?` · Entry ${n(t.entry)}`:''}</div></div>`).join('');
}catch(e){$('live').textContent='OFFLINE';$('error').textContent=e.message;}}
load();setInterval(load,10000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
