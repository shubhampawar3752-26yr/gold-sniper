<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Sniper — Live Dashboard</title>
<meta name="description" content="EMA 9/21 crossover gold trading system with ATR-based SL/TP levels">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a0f;
  --card: #1a1a25;
  --border: #333;
  --gold: #FFD700;
  --gold-orange: #FFA500;
  --green: #00e676;
  --red: #ff4444;
  --text: #e0e0e0;
  --muted: #666;
}
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 100vh; }

.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px;
  background: linear-gradient(135deg, #12121a, #1a1a25);
  border-bottom: 1px solid var(--border);
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo svg { width: 28px; height: 28px; }
.logo-text {
  font-size: 22px; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(135deg, var(--gold), var(--gold-orange));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.feed-badge {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; letter-spacing: 1px;
  background: rgba(0,255,100,0.1); border: 1px solid rgba(0,255,100,0.3); color: var(--green);
}
.feed-badge.offline { background: rgba(255,68,68,0.1); border-color: rgba(255,68,68,0.3); color: var(--red); }
.feed-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.5s ease-in-out infinite; }
.feed-dot.offline { background: var(--red); animation: none; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.container { max-width: 1200px; margin: 0 auto; padding: 24px; }

.error-banner {
  padding: 12px 20px; background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.3);
  border-radius: 10px; margin-bottom: 16px; font-size: 14px; color: var(--red); text-align: center; display: none;
}

.price-card {
  background: linear-gradient(135deg, var(--card), #12121a);
  border: 1px solid var(--border); border-radius: 16px; padding: 32px;
  margin-bottom: 24px; text-align: center; position: relative; overflow: hidden;
}
.price-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.price-label { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; }
.price-value { font-size: 48px; font-weight: 800; color: var(--gold); transition: color 0.3s; }
.price-value.up { color: var(--green); }
.price-value.down { color: var(--red); }
.price-change { font-size: 18px; margin-top: 8px; font-weight: 600; }
.price-change.up { color: var(--green); }
.price-change.down { color: var(--red); }
.price-meta { display: flex; justify-content: center; gap: 24px; margin-top: 16px; font-size: 13px; color: var(--muted); }
.market-state { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
.market-state.regular { background: rgba(0,255,100,0.15); color: var(--green); }
.market-state.closed { background: rgba(255,68,68,0.15); color: var(--red); }
.market-state.unknown { background: rgba(255,204,0,0.15); color: #ffcc00; }
.last-update { font-size: 12px; color: #555; margin-top: 12px; }

.section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.section-title h2 { font-size: 18px; font-weight: 700; color: #ccc; }
.trade-count {
  padding: 4px 12px; background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.3);
  border-radius: 12px; font-size: 13px; font-weight: 600; color: var(--gold);
}

.trade-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
.trade-card {
  background: linear-gradient(135deg, var(--card), #12121a);
  border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; overflow: hidden;
}
.trade-card::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 3px; }
.trade-card.long::before { background: var(--green); }
.trade-card.short::before { background: var(--red); }
.trade-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.trade-tf { font-size: 16px; font-weight: 700; color: #fff; }
.trade-dir { padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
.trade-dir.long { background: rgba(0,255,100,0.15); color: var(--green); }
.trade-dir.short { background: rgba(255,68,68,0.15); color: var(--red); }
.trade-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.stat { text-align: center; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px; }
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 4px; }
.stat-value { font-size: 15px; font-weight: 700; color: #ccc; }
.stat-value.entry { color: var(--gold); }
.stat-value.sl { color: var(--red); }
.stat-value.atr { color: var(--green); }
.tp-section { margin-top: 12px; }
.tp-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
.tp-grid { display: flex; gap: 6px; }
.tp-item { flex: 1; text-align: center; padding: 8px 4px; border-radius: 6px; font-size: 11px; font-weight: 600; border: 1px solid transparent; transition: all 0.3s; }
.tp-item .tp-label { font-size: 9px; color: #555; margin-bottom: 2px; }
.tp-item .tp-price { font-size: 12px; font-weight: 700; }
.tp-item.hit { background: rgba(0,255,100,0.1); border-color: rgba(0,255,100,0.3); }
.tp-item.hit .tp-price { color: var(--green); }
.tp-item.hit .tp-label { color: var(--green); }
.tp-item.pending { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.1); }
.tp-item.pending .tp-price { color: #888; }
.tp-item.pending .tp-label { color: #555; }
.trade-cycle { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 12px; color: var(--muted); }
.cycle-badge { padding: 2px 8px; border-radius: 4px; background: rgba(255,215,0,0.1); color: var(--gold); font-weight: 600; }

.no-trades { text-align: center; padding: 48px 24px; background: linear-gradient(135deg, var(--card), #12121a); border: 1px solid var(--border); border-radius: 12px; }
.no-trades-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
.no-trades-text { font-size: 15px; color: var(--muted); }

.progress-bar { margin-top: 14px; height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--green), var(--gold)); transition: width 0.5s; }

.footer { text-align: center; padding: 24px; font-size: 12px; color: #444; }
.footer a { color: var(--gold); text-decoration: none; }
.footer .repo-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; }

@media (max-width: 600px) {
  .price-value { font-size: 36px; }
  .trade-grid { grid-template-columns: 1fr; }
  .header { padding: 12px 16px; }
  .container { padding: 16px; }
  .price-card { padding: 20px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10" stroke="#FFD700" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="6" stroke="#FFA500" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="2" fill="#FFD700"/>
      <line x1="12" y1="2" x2="12" y2="5" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12" y1="19" x2="12" y2="22" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="2" y1="12" x2="5" y2="12" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="19" y1="12" x2="22" y2="12" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span class="logo-text">GOLD SNIPER</span>
  </div>
  <div class="feed-badge" id="feedBadge">
    <span class="feed-dot" id="feedDot"></span>
    <span id="feedText">FEED</span>
  </div>
</div>

<div class="container">
  <div class="error-banner" id="errorBanner"></div>

  <div class="price-card" id="priceCard">
    <div class="price-label">Gold (GC=F) — Live Price</div>
    <div class="price-value" id="priceValue">— —</div>
    <div class="price-change" id="priceChange"></div>
    <div class="price-meta">
      <span>Prev Close: <strong id="prevClose" style="color:#aaa">—</strong></span>
      <span>Market: <span class="market-state unknown" id="marketState">—</span></span>
      <span>Last Tick: <strong id="lastTick" style="color:#aaa">—</strong></span>
    </div>
    <div class="last-update" id="lastUpdate">Connecting…</div>
  </div>

  <div class="trades-section">
    <div class="section-title">
      <h2>Active Trades</h2>
      <span class="trade-count" id="tradeCount">0</span>
    </div>
    <div class="trade-grid" id="tradeGrid">
      <div class="no-trades">
        <div class="no-trades-icon">📊</div>
        <div class="no-trades-text">No active trades — monitoring for signals</div>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  Gold Sniper Trading System &copy; 2026 — EMA 9/21 Crossover · ATR-Based SL/TP · 5 Timeframes
  <br>
  <a href="https://github.com/shubhampawar3752-26yr/gold-sniper" class="repo-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.9 1.2 1.9 1.2 1 .8 2.7.6 3.3.2.1-.8.4-1.4.8-1.7-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.3 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.7.2 2.9.1 3.2.8.9 1.2 1.9 1.2 3.2 0 4.6-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>
    github.com/shubhampawar3752-26yr/gold-sniper
  </a>
</div>

<script>
const API = 'https://schegpkwfwkgfmmpnzic.supabase.co/functions/v1/get-live-price';
let isOnline = false;
let lastPrice = null;

function setOnline(online) {
  if (isOnline === online) return;
  isOnline = online;
  const badge = document.getElementById('feedBadge');
  const dot = document.getElementById('feedDot');
  const text = document.getElementById('feedText');
  if (online) {
    badge.classList.remove('offline');
    dot.classList.remove('offline');
    text.textContent = 'FEED LIVE';
    document.getElementById('errorBanner').style.display = 'none';
  } else {
    badge.classList.add('offline');
    dot.classList.add('offline');
    text.textContent = 'OFFLINE';
  }
}

function fmt(v) { return v == null || isNaN(v) ? '—' : v.toFixed(2); }
function dirClass(d) { return (d === 'long' || d === 'buy') ? 'long' : 'short'; }
function dirLabel(d) { return (d === 'long' || d === 'buy') ? 'LONG' : 'SHORT'; }

async function fetchDashboard() {
  try {
    const res = await fetch(API, { method: 'GET' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Fetch failed');

    setOnline(true);

    // Price
    const priceEl = document.getElementById('priceValue');
    const newPrice = data.price;
    priceEl.textContent = '$' + newPrice.toFixed(2);
    if (lastPrice !== null) {
      priceEl.classList.remove('up', 'down');
      if (newPrice > lastPrice) priceEl.classList.add('up');
      else if (newPrice < lastPrice) priceEl.classList.add('down');
    }
    lastPrice = newPrice;

    document.getElementById('prevClose').textContent = '$' + fmt(data.prevClose);

    const chgEl = document.getElementById('priceChange');
    const chg = data.change || 0;
    const chgPct = data.changePct || 0;
    chgEl.textContent = (chg >= 0 ? '+' : '') + chg.toFixed(2) + '  (' + (chgPct >= 0 ? '+' : '') + chgPct.toFixed(2) + '%)';
    chgEl.className = 'price-change ' + (chg >= 0 ? 'up' : 'down');

    const msEl = document.getElementById('marketState');
    const ms = (data.marketState || 'unknown').toLowerCase();
    msEl.textContent = ms === 'regular' ? 'OPEN' : (ms === 'closed' ? 'CLOSED' : ms.toUpperCase());
    msEl.className = 'market-state ' + (ms === 'regular' ? 'regular' : ms === 'closed' ? 'closed' : 'unknown');

    const tick = data.lastTick;
    document.getElementById('lastTick').textContent = tick && tick.lastTime ? tick.lastTime : '—';
    document.getElementById('lastUpdate').textContent = 'Updated: ' + (data.timestamp || new Date().toISOString()) + (data.lastMonitorRun ? ' · Monitor: ' + data.lastMonitorRun : '');

    // Trades
    const trades = data.activeTrades || [];
    document.getElementById('tradeCount').textContent = data.activeCount != null ? data.activeCount : trades.length;

    const grid = document.getElementById('tradeGrid');
    if (trades.length === 0) {
      grid.innerHTML = '<div class="no-trades"><div class="no-trades-icon">📊</div><div class="no-trades-text">No active trades — monitoring for signals</div></div>';
      return;
    }

    grid.innerHTML = trades.map(t => {
      const dc = dirClass(t.direction);
      const tps = [
        { l: 'TP1', p: t.tp1, h: t.tp1Hit }, { l: 'TP2', p: t.tp2, h: t.tp2Hit },
        { l: 'TP3', p: t.tp3, h: t.tp3Hit }, { l: 'TP4', p: t.tp4, h: t.tp4Hit },
        { l: 'TP5', p: t.tp5, h: t.tp5Hit }
      ];
      const hitCount = tps.filter(x => x.h === true).length;
      const tpHtml = tps.map(tp => {
        const isHit = tp.h === true;
        return '<div class="tp-item ' + (isHit ? 'hit' : 'pending') + '">' +
          '<div class="tp-label">' + tp.l + (isHit ? ' ✓' : '') + '</div>' +
          '<div class="tp-price">' + (tp.p != null && tp.p > 0 ? fmt(tp.p) : '—') + '</div></div>';
      }).join('');

      const pct = (hitCount / 5) * 100;
      return '<div class="trade-card ' + dc + '">' +
        '<div class="trade-header">' +
          '<span class="trade-tf">' + (t.timeframe || '—') + '</span>' +
          '<span class="trade-dir ' + dc + '">' + dirLabel(t.direction) + '</span>' +
        '</div>' +
        '<div class="trade-stats">' +
          '<div class="stat"><div class="stat-label">Entry</div><div class="stat-value entry">$' + fmt(t.entry) + '</div></div>' +
          '<div class="stat"><div class="stat-label">Stop Loss</div><div class="stat-value sl">$' + fmt(t.sl) + '</div></div>' +
          '<div class="stat"><div class="stat-label">ATR</div><div class="stat-value atr">' + fmt(t.atr) + '</div></div>' +
        '</div>' +
        '<div class="tp-section">' +
          '<div class="tp-section-title">Take Profit Progress (' + hitCount + '/5)</div>' +
          '<div class="tp-grid">' + tpHtml + '</div>' +
        '</div>' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="trade-cycle"><span>Cycle</span><span class="cycle-badge">#' + (t.cycle || '—') + '</span></div>' +
      '</div>';
    }).join('');
  } catch (err) {
    setOnline(false);
    document.getElementById('errorBanner').textContent = '⚠ Connection error: ' + err.message + ' — Retrying…';
    document.getElementById('errorBanner').style.display = 'block';
  }
}

fetchDashboard();
setInterval(fetchDashboard, 5000);
</script>
</body>
</html>
