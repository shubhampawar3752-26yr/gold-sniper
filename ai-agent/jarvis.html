<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis AI Assistant — Voice</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2300d4ff' opacity='0.2'/><circle cx='50' cy='50' r='25' fill='none' stroke='%2300d4ff' stroke-width='3'/><circle cx='50' cy='50' r='3' fill='%2300d4ff'/></svg>">
<style>
:root {
  --bg: #0a0e14; --surface: #111720; --surface2: #1a2230;
  --accent: #00d4ff; --accent2: #0099cc; --glow: rgba(0,212,255,0.15);
  --text: #e8e8e8; --muted: #667; --border: #1e2a3a;
  --user-bg: #0d2818; --user-border: #1a4d2e;
  --jarvis-bg: #0a1620; --jarvis-border: #1a3a4d;
  --recording: #ff4444;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
body::before { content:''; position:fixed; top:0; left:0; right:0; bottom:0; background:radial-gradient(ellipse at 50% 0%, var(--glow) 0%, transparent 70%); pointer-events:none; z-index:0; }
header { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; gap:12px; z-index:1; position:relative; }
.logo { display:flex; align-items:center; gap:10px; }
.logo-icon { width:36px; height:36px; border-radius:50%; border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; position:relative; }
.logo-icon::after { content:''; position:absolute; inset:4px; border-radius:50%; border:1px solid var(--accent); opacity:0.4; animation:pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.2;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.1)} }
.logo-icon span { font-size:10px; color:var(--accent); font-weight:700; letter-spacing:1px; }
.logo h1 { font-size:18px; font-weight:600; letter-spacing:1px; color:var(--accent); }
.badge { font-size:10px; padding:3px 8px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--muted); }
.header-right { margin-left:auto; display:flex; align-items:center; gap:8px; }
.voice-toggle { display:flex; align-items:center; gap:6px; padding:6px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:20px; cursor:pointer; transition:all 0.2s; }
.voice-toggle:hover { border-color:var(--accent); }
.voice-toggle.active { background:rgba(0,212,255,0.1); border-color:var(--accent); color:var(--accent); }
.voice-toggle svg { width:16px; height:16px; }
.skills-badge { font-size:11px; color:var(--muted); }
.avatar { width:32px; height:32px; border-radius:50%; background:var(--accent2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:#fff; }
#chatArea { flex:1; overflow-y:auto; z-index:1; position:relative; scroll-behavior:smooth; }
#chatWrap { max-width:800px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.welcome { text-align:center; padding:40px 20px; margin-top:30px; }
.welcome .ring { width:80px; height:80px; margin:0 auto 20px; border-radius:50%; border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; position:relative; }
.welcome .ring::before, .welcome .ring::after { content:''; position:absolute; inset:-8px; border-radius:50%; border:1px solid var(--accent); opacity:0.3; }
.welcome .ring::after { inset:-16px; opacity:0.15; }
.welcome .ring span { font-size:24px; }
.welcome h2 { color:var(--accent); font-size:22px; margin-bottom:8px; letter-spacing:2px; }
.welcome p { color:var(--muted); font-size:14px; }
.welcome .voice-hint { margin-top:12px; font-size:12px; color:var(--accent); opacity:0.7; }
.msg { display:flex; gap:10px; max-width:85%; animation:fadeIn 0.3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
.msg.user .bubble { background:var(--user-bg); border:1px solid var(--user-border); }
.msg.jarvis .bubble { background:var(--jarvis-bg); border:1px solid var(--jarvis-border); }
.msg-avatar { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }
.msg.user .msg-avatar { background:#1a4d2e; color:#4ade80; }
.msg.jarvis .msg-avatar { background:#1a3a4d; color:var(--accent); border:1px solid var(--accent2); }
.bubble { padding:10px 14px; border-radius:12px; line-height:1.6; font-size:14px; white-space:pre-wrap; word-break:break-word; }
.bubble strong { color:var(--accent); }
.typing { display:flex; gap:6px; align-items:center; }
.typing span { width:8px; height:8px; border-radius:50%; background:var(--accent); opacity:0.4; animation:bounce 1.4s infinite; }
.typing span:nth-child(2){animation-delay:0.2s} .typing span:nth-child(3){animation-delay:0.4s}
@keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-6px);opacity:1} }

/* Voice indicator */
.voice-indicator { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); display:none; align-items:center; gap:8px; padding:8px 16px; background:var(--surface); border:1px solid var(--recording); border-radius:20px; z-index:10; }
.voice-indicator.show { display:flex; }
.voice-indicator .dot { width:10px; height:10px; border-radius:50%; background:var(--recording); animation:recPulse 1s infinite; }
@keyframes recPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.7)} }
.voice-indicator span { font-size:13px; color:var(--recording); }

/* Speaking indicator */
.speaking-bar { position:fixed; bottom:72px; left:0; right:0; height:3px; z-index:10; display:none; overflow:hidden; }
.speaking-bar.show { display:block; }
.speaking-bar .wave { height:100%; background:linear-gradient(90deg, transparent, var(--accent), transparent); background-size:200% 100%; animation:wave 1.5s linear infinite; }
@keyframes wave { from{background-position:200% 0} to{background-position:-200% 0} }

#inputArea { background:var(--surface); border-top:1px solid var(--border); padding:12px 16px; z-index:1; position:relative; }
#inputWrap { max-width:800px; margin:0 auto; display:flex; gap:8px; align-items:flex-end; }
#input { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px 16px; color:var(--text); font-size:15px; font-family:inherit; resize:none; min-height:44px; max-height:120px; outline:none; transition:border-color 0.2s; }
#input:focus { border-color:var(--accent); box-shadow:0 0 0 2px var(--glow); }
#input::placeholder { color:var(--muted); }
#micBtn { width:44px; height:44px; border-radius:50%; background:var(--surface2); border:1px solid var(--border); color:var(--muted); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; flex-shrink:0; }
#micBtn:hover { border-color:var(--accent); color:var(--accent); }
#micBtn.recording { background:var(--recording); border-color:var(--recording); color:#fff; animation:micPulse 1.5s infinite; }
@keyframes micPulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,68,68,0.4)} 50%{box-shadow:0 0 0 8px rgba(255,68,68,0)} }
#sendBtn { width:44px; height:44px; border-radius:50%; background:var(--accent); border:none; color:var(--bg); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; flex-shrink:0; }
#sendBtn:hover { background:var(--accent2); transform:scale(1.05); }
#sendBtn:disabled { background:var(--surface2); color:var(--muted); cursor:not-allowed; transform:none; }
.footer { text-align:center; padding:6px; font-size:11px; color:var(--muted); }
.footer .voice-status { color:var(--accent); }
@media (max-width:600px){ .welcome{padding:20px;margin-top:10px} .msg{max-width:92%} #chatWrap{padding:10px} .header-right .skills-badge{display:none} }
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon"><span>J</span></div>
    <h1>JARVIS</h1>
    <span class="badge">GPT-OSS-120B</span>
  </div>
  <div class="header-right">
    <div class="voice-toggle" id="voiceToggle" onclick="toggleVoiceMode()" title="Voice auto-reply mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <span id="voiceToggleLabel">Voice OFF</span>
    </div>
    <span class="skills-badge">6 Skills</span>
    <div class="avatar">VJ</div>
  </div>
</header>

<div id="chatArea">
  <div id="chatWrap">
    <div class="welcome" id="welcome">
      <div class="ring"><span>🎙️</span></div>
      <h2>JARVIS</h2>
      <p>आपका personal AI assistant — Vikash sir द्वारा designed</p>
      <div class="voice-hint">🎙️ माइक बटन दबाकर बोलें या टाइप करें</div>
    </div>
  </div>
</div>

<!-- Voice recording indicator -->
<div class="voice-indicator" id="voiceIndicator">
  <div class="dot"></div>
  <span>सुन रहा हूँ... (बोलें)</span>
</div>

<!-- Speaking wave bar -->
<div class="speaking-bar" id="speakingBar"><div class="wave"></div></div>

<div id="inputArea">
  <div id="inputWrap">
    <button id="micBtn" onclick="toggleRecording()" title="बोलने के लिए क्लिक करें">
      🎤
    </button>
    <textarea id="input" placeholder="Jarvis से बात करें या 🎤 दबाकर बोलें..." rows="1"></textarea>
    <button id="sendBtn">↑</button>
  </div>
  <div class="footer">Jarvis v3.0 Voice | <span class="voice-status" id="voiceStatus">Voice ready</span> | Migrated from LiveKit to Web Speech</div>
</div>

<script>
const API = '/api/jarvis';
var chatHistory = [];
var sending = false;
var chatWrap = document.getElementById('chatWrap');
var chatArea = document.getElementById('chatArea');
var inputEl = document.getElementById('input');
var sendBtn = document.getElementById('sendBtn');
var micBtn = document.getElementById('micBtn');
var welcome = document.getElementById('welcome');
var voiceIndicator = document.getElementById('voiceIndicator');
var speakingBar = document.getElementById('speakingBar');
var voiceToggle = document.getElementById('voiceToggle');
var voiceToggleLabel = document.getElementById('voiceToggleLabel');
var voiceStatus = document.getElementById('voiceStatus');

// ── Voice State ──
var voiceMode = false;        // Auto-speak replies
var isRecording = false;
var recognition = null;
var synth = window.speechSynthesis;
var voices = [];
var currentUtterance = null;

// Load voices
function loadVoices() {
  voices = synth ? synth.getVoices() : [];
}
if (synth) {
  loadVoices();
  synth.onvoiceschanged = loadVoices;
}

// ── Text-to-Speech (Jarvis speaks) ──
function speak(text) {
  if (!synth) return;
  // Cancel any ongoing speech
  synth.cancel();
  
  // Clean markdown for speech
  var cleanText = text.replace(/\*\*/g, '').replace(/[*_#`]/g, '').replace(/\[.*?\]\(.*?\)/g, '').replace(/#{1,3}\s/g, '');
  
  var utter = new SpeechSynthesisUtterance(cleanText);
  utter.lang = 'hi-IN';
  utter.rate = 0.95;
  utter.pitch = 0.85;  // Lower pitch for Jarvis-like voice
  
  // Try to find a Hindi or Indian English voice
  var hindiVoice = voices.find(v => v.lang === 'hi-IN');
  var enInVoice = voices.find(v => v.lang === 'en-IN');
  if (hindiVoice) utter.voice = hindiVoice;
  else if (enInVoice) utter.voice = enInVoice;
  
  utter.onstart = function() {
    speakingBar.classList.add('show');
    voiceStatus.textContent = 'Jarvis बोल रहा है...';
  };
  utter.onend = function() {
    speakingBar.classList.remove('show');
    voiceStatus.textContent = voiceMode ? 'Voice ON' : 'Voice ready';
    // Auto-listen again if voice mode is on
    if (voiceMode && !isRecording) {
      setTimeout(function() { startRecording(); }, 500);
    }
  };
  utter.onerror = function() {
    speakingBar.classList.remove('show');
    voiceStatus.textContent = voiceMode ? 'Voice ON' : 'Voice ready';
  };
  
  currentUtterance = utter;
  synth.speak(utter);
}

function stopSpeaking() {
  if (synth) synth.cancel();
  speakingBar.classList.remove('show');
}

// ── Speech Recognition (User speaks) ──
function initRecognition() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    micBtn.style.display = 'none';
    voiceStatus.textContent = 'Voice not supported';
    return null;
  }
  
  var rec = new SR();
  rec.lang = 'hi-IN';        // Hindi primary
  rec.continuous = false;
  rec.interimResults = true;
  
  rec.onstart = function() {
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.innerHTML = '⏹';
    voiceIndicator.classList.add('show');
    voiceStatus.textContent = 'सुन रहा हूँ...';
  };
  
  rec.onresult = function(event) {
    var interim = '';
    var final = '';
    for (var i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        final += event.results[i][0].transcript;
      } else {
        interim += event.results[i][0].transcript;
      }
    }
    if (interim) {
      inputEl.value = interim;
      inputEl.focus();
    }
    if (final) {
      inputEl.value = final;
      // Auto-send after speech
      setTimeout(function() {
        if (inputEl.value.trim()) {
          send();
        }
      }, 300);
    }
  };
  
  rec.onerror = function(event) {
    console.log('Speech error:', event.error);
    if (event.error === 'no-speech') {
      voiceStatus.textContent = 'कुछ सुनाई नहीं दिया';
    } else if (event.error === 'not-allowed') {
      voiceStatus.textContent = 'माइक permission दें';
    } else {
      voiceStatus.textContent = 'Voice error: ' + event.error;
    }
  };
  
  rec.onend = function() {
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.innerHTML = '🎤';
    voiceIndicator.classList.remove('show');
    if (voiceStatus.textContent === 'सुन रहा हूँ...') {
      voiceStatus.textContent = voiceMode ? 'Voice ON' : 'Voice ready';
    }
  };
  
  return rec;
}

function startRecording() {
  if (!recognition) recognition = initRecognition();
  if (!recognition) return;
  if (isRecording) return;
  stopSpeaking();
  try {
    recognition.start();
  } catch(e) { console.log('Start error:', e); }
}

function stopRecording() {
  if (recognition && isRecording) {
    recognition.stop();
  }
}

function toggleRecording() {
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
}

// ── Voice Mode Toggle (auto-speak + auto-listen) ──
function toggleVoiceMode() {
  voiceMode = !voiceMode;
  if (voiceMode) {
    voiceToggle.classList.add('active');
    voiceToggleLabel.textContent = 'Voice ON';
    voiceStatus.textContent = 'Voice ON';
    // Greet user in voice mode
    speak('Voice mode active. अब मैं आपके जवाब बोलकर दूँगा। माइक बटन दबाकर बात करें।');
  } else {
    voiceToggle.classList.remove('active');
    voiceToggleLabel.textContent = 'Voice OFF';
    voiceStatus.textContent = 'Voice ready';
    stopSpeaking();
    stopRecording();
  }
}

// ── Chat Functions ──
function addMsg(text, role) {
  if (welcome) welcome.style.display = 'none';
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  var avatar = role === 'user' ? 'VJ' : 'J';
  div.innerHTML = '<div class="msg-avatar">' + avatar + '</div><div class="bubble">' + escapeHtml(text) + '</div>';
  chatWrap.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
}

function addTyping() {
  if (welcome) welcome.style.display = 'none';
  var div = document.createElement('div');
  div.className = 'msg jarvis';
  div.id = 'typing';
  div.innerHTML = '<div class="msg-avatar">J</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chatWrap.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  var t = document.getElementById('typing');
  if (t) t.remove();
}

function send() {
  if (sending) return;
  var message = inputEl.value.trim();
  if (!message) return;
  sending = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  stopSpeaking();

  addMsg(message, 'user');
  chatHistory.push({ role: 'user', content: message });
  addTyping();

  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: message, history: chatHistory.slice(-10) })
  }).then(function(res) {
    if (!res.ok) {
      return res.text().then(function(t) {
        throw new Error('Server: ' + t.slice(0, 200));
      });
    }
    return res.json();
  }).then(function(data) {
    removeTyping();
    if (data.reply) {
      addMsg(data.reply, 'jarvis');
      chatHistory.push({ role: 'assistant', content: data.reply });
      // Speak the reply if voice mode is on
      if (voiceMode) {
        speak(data.reply);
      }
    } else if (data.error) {
      addMsg('Error: ' + data.error, 'jarvis');
    }
    sending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }).catch(function(err) {
    removeTyping();
    addMsg('Connection error: ' + err.message, 'jarvis');
    sending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  });
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', function() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// Init recognition on first user interaction (browsers require user gesture)
document.addEventListener('click', function initVoice() {
  if (!recognition) {
    recognition = initRecognition();
  }
  document.removeEventListener('click', initVoice);
}, { once: true });
</script>
</body>
</html>
