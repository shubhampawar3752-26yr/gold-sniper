<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis AI Assistant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2300d4ff' opacity='0.2'/><circle cx='50' cy='50' r='25' fill='none' stroke='%2300d4ff' stroke-width='3'/><circle cx='50' cy='50' r='3' fill='%2300d4ff'/></svg>">
<style>
:root {
  --bg: #0a0e14; --surface: #111720; --surface2: #1a2230;
  --accent: #00d4ff; --accent2: #0099cc; --glow: rgba(0,212,255,0.15);
  --text: #e8e8e8; --muted: #667; --border: #1e2a3a;
  --user-bg: #0d2818; --user-border: #1a4d2e;
  --jarvis-bg: #0a1620; --jarvis-border: #1a3a4d;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
body::before { content:''; position:fixed; top:0; left:0; right:0; bottom:0; background:radial-gradient(ellipse at 50% 0%, var(--glow) 0%, transparent 70%); pointer-events:none; z-index:0; }
header { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; gap:12px; z-index:1; position:relative; }
.logo { display:flex; align-items:center; gap:10px; }
.logo-icon { width:36px; height:36px; border-radius:50%; border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; position:relative; }
.logo-icon::after { content:''; position:absolute; inset:4px; border-radius:50%; border:1px solid var(--accent); opacity:0.4; animation:pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.2;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.1)} }
.logo-icon span { font-size:10px; color:var(--accent); font-weight:700; letter-spacing:1px; }
.logo h1 { font-size:18px; font-weight:600; letter-spacing:1px; color:var(--accent); }
.badge { font-size:10px; padding:3px 8px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--muted); }
.header-right { margin-left:auto; display:flex; align-items:center; gap:12px; }
.skills-badge { font-size:11px; color:var(--muted); }
#chatArea { flex:1; overflow-y:auto; z-index:1; position:relative; scroll-behavior:smooth; }
#chatWrap { max-width:800px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.welcome { text-align:center; padding:40px 20px; margin-top:30px; }
.welcome .ring { width:80px; height:80px; margin:0 auto 20px; border-radius:50%; border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; position:relative; }
.welcome .ring::before, .welcome .ring::after { content:''; position:absolute; inset:-8px; border-radius:50%; border:1px solid var(--accent); opacity:0.3; }
.welcome .ring::after { inset:-16px; opacity:0.15; }
.welcome .ring span { font-size:24px; }
.welcome h2 { color:var(--accent); font-size:22px; margin-bottom:8px; letter-spacing:2px; }
.welcome p { color:var(--muted); font-size:14px; }
.msg { display:flex; gap:10px; max-width:85%; animation:fadeIn 0.3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
.msg.user .bubble { background:var(--user-bg); border:1px solid var(--user-border); }
.msg.jarvis .bubble { background:var(--jarvis-bg); border:1px solid var(--jarvis-border); }
.avatar { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }
.msg.user .avatar { background:#1a4d2e; color:#4ade80; }
.msg.jarvis .avatar { background:#1a3a4d; color:var(--accent); border:1px solid var(--accent2); }
.bubble { padding:10px 14px; border-radius:12px; line-height:1.6; font-size:14px; white-space:pre-wrap; word-break:break-word; }
.bubble strong { color:var(--accent); }
.typing { display:flex; gap:6px; align-items:center; }
.typing span { width:8px; height:8px; border-radius:50%; background:var(--accent); opacity:0.4; animation:bounce 1.4s infinite; }
.typing span:nth-child(2){animation-delay:0.2s} .typing span:nth-child(3){animation-delay:0.4s}
@keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-6px);opacity:1} }
#inputArea { background:var(--surface); border-top:1px solid var(--border); padding:12px 16px; z-index:1; position:relative; }
#inputWrap { max-width:800px; margin:0 auto; display:flex; gap:8px; align-items:flex-end; }
#input { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px 16px; color:var(--text); font-size:15px; font-family:inherit; resize:none; min-height:44px; max-height:120px; outline:none; transition:border-color 0.2s; }
#input:focus { border-color:var(--accent); box-shadow:0 0 0 2px var(--glow); }
#input::placeholder { color:var(--muted); }
#sendBtn { width:44px; height:44px; border-radius:50%; background:var(--accent); border:none; color:var(--bg); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; flex-shrink:0; }
#sendBtn:hover { background:var(--accent2); transform:scale(1.05); }
#sendBtn:disabled { background:var(--surface2); color:var(--muted); cursor:not-allowed; transform:none; }
.footer { text-align:center; padding:6px; font-size:11px; color:var(--muted); }
@media (max-width:600px){ .welcome{padding:20px;margin-top:10px} .msg{max-width:92%} #chatWrap{padding:10px} }
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon"><span>J</span></div>
    <h1>JARVIS</h1>
    <span class="badge">GPT-OSS-120B</span>
  </div>
  <div class="header-right">
    <span class="skills-badge">5 Skills</span>
    <div style="width:32px;height:32px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;">VJ</div>
  </div>
</header>

<div id="chatArea">
  <div id="chatWrap">
    <div class="welcome" id="welcome">
      <div class="ring"><span>🤖</span></div>
      <h2>JARVIS</h2>
      <p>आपका personal AI assistant — Vikash sir द्वारा designed</p>
    </div>
  </div>
</div>

<div id="inputArea">
  <div id="inputWrap">
    <textarea id="input" placeholder="Jarvis से बात करें..." rows="1"></textarea>
    <button id="sendBtn">↑</button>
  </div>
  <div class="footer">Jarvis — Voice of the Future | Migrated from v3.0 to Vercel</div>
</div>

<script>
const API = '/api/jarvis';
var chatHistory = [];
var sending = false;
var chatWrap = document.getElementById('chatWrap');
var chatArea = document.getElementById('chatArea');
var inputEl = document.getElementById('input');
var sendBtn = document.getElementById('sendBtn');
var welcome = document.getElementById('welcome');

function addMsg(text, role) {
  if (welcome) welcome.style.display = 'none';
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  var avatar = role === 'user' ? 'VJ' : 'J';
  div.innerHTML = '<div class="avatar">' + avatar + '</div><div class="bubble">' + escapeHtml(text) + '</div>';
  chatWrap.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
}

function addTyping() {
  if (welcome) welcome.style.display = 'none';
  var div = document.createElement('div');
  div.className = 'msg jarvis';
  div.id = 'typing';
  div.innerHTML = '<div class="avatar">J</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chatWrap.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  var t = document.getElementById('typing');
  if (t) t.remove();
}

function send() {
  if (sending) return;
  var message = inputEl.value.trim();
  if (!message) return;
  sending = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  addMsg(message, 'user');
  chatHistory.push({ role: 'user', content: message });
  addTyping();

  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: message, history: chatHistory.slice(-10) })
  }).then(function(res) {
    if (!res.ok) {
      return res.text().then(function(t) {
        throw new Error('Server: ' + t.slice(0, 200));
      });
    }
    return res.json();
  }).then(function(data) {
    removeTyping();
    if (data.reply) {
      addMsg(data.reply, 'jarvis');
      chatHistory.push({ role: 'assistant', content: data.reply });
    } else if (data.error) {
      addMsg('Error: ' + data.error, 'jarvis');
    }
    sending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }).catch(function(err) {
    removeTyping();
    addMsg('Connection error: ' + err.message, 'jarvis');
    sending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  });
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', function() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
