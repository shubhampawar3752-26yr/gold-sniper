<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Sniper AI Agent</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a0f; --card: #1a1a25; --border: #333;
  --gold: #FFD700; --gold-dim: #B8860B;
  --green: #00e676; --red: #ff4444; --blue: #2196F3;
  --text: #e0e0e0; --muted: #666;
}
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }

/* Login screen */
.login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; }
.login-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 320px; text-align: center; }
.login-card h1 { font-size: 22px; margin-bottom: 8px; }
.login-card h1 span { color: var(--gold); }
.login-card p { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
.login-input { width: 100%; padding: 12px 16px; background: #0d0d15; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; text-align: center; }
.login-input:focus { border-color: var(--gold-dim); }
.login-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--gold), var(--gold-dim)); color: #000; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; margin-top: 12px; }
.login-btn:hover { opacity: 0.9; }
.login-error { color: var(--red); font-size: 12px; min-height: 16px; }

/* Chat screen (hidden initially) */
.chat-screen { display: none; flex-direction: column; height: 100vh; }
.chat-screen.active { display: flex; }

.header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: linear-gradient(135deg, #12121a, #1a1a25); border-bottom: 1px solid var(--border); }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--gold), var(--gold-dim)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.logo-text { font-size: 18px; font-weight: 700; }
.logo-text span { color: var(--gold); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
.badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); color: var(--muted); }
.logout { padding: 6px 12px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 12px; cursor: pointer; }
.logout:hover { border-color: var(--red); color: var(--red); }

.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; }
.msg.user { align-self: flex-end; background: #1e3a5f; border: 1px solid #2a4a6f; }
.msg.agent { align-self: flex-start; background: var(--card); border: 1px solid var(--border); }
.msg.system { align-self: center; background: transparent; color: var(--muted); font-size: 12px; border: 1px dashed var(--border); }
.msg.skill { align-self: flex-start; background: #0d1f0d; border: 1px solid var(--green); font-size: 12px; color: var(--green); }
.typing { align-self: flex-start; color: var(--muted); font-style: italic; padding: 8px 16px; }

.skills-bar { display: flex; gap: 6px; padding: 8px 20px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
.skill-btn { padding: 6px 12px; background: transparent; border: 1px solid var(--border); border-radius: 16px; color: var(--muted); font-size: 11px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
.skill-btn:hover { border-color: var(--gold-dim); color: var(--gold); background: rgba(255,215,0,0.05); }
.skill-btn.green:hover { border-color: var(--green); color: var(--green); }
.skill-btn.blue:hover { border-color: var(--blue); color: var(--blue); }

.input-area { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border); background: var(--card); }
.input-area input { flex: 1; padding: 12px 16px; background: #0d0d15; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; }
.input-area input:focus { border-color: var(--gold-dim); }
.input-area button { padding: 12px 24px; background: linear-gradient(135deg, var(--gold), var(--gold-dim)); color: #000; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
.input-area button:hover { opacity: 0.9; }
.input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

.stream-toggle { display: flex; align-items: center; gap: 6px; padding: 0 20px 8px; font-size: 11px; color: var(--muted); }
.stream-toggle input { accent-color: var(--gold); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>Gold <span>Sniper</span> AI</h1>
    <p>Enter your access token to continue</p>
    <input type="password" class="login-input" id="authInput" placeholder="Access token" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Unlock Agent</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- Chat Screen -->
<div class="chat-screen" id="chatScreen">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🎯</div>
      <div class="logo-text">Gold <span>Sniper</span> AI</div>
      <span class="badge">GPT-OSS-120B</span>
    </div>
    <div class="logo">
      <div class="status-dot"></div>
      <span style="font-size: 12px; color: var(--muted); margin-right: 12px;">Vercel + Groq</span>
      <button class="logout" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="skills-bar">
    <button class="skill-btn" onclick="ask('What is the current gold price?')">Live Price</button>
    <button class="skill-btn" onclick="ask('Show me active trades')">Active Trades</button>
    <button class="skill-btn" onclick="ask('Trade history last 15')">Trade History</button>
    <button class="skill-btn" onclick="ask('Show me AI candle analysis')">AI Patterns</button>
    <button class="skill-btn" onclick="ask('Recent alerts')">Alerts</button>
    <button class="skill-btn" onclick="ask('Engine status?')">Engine Status</button>
    <button class="skill-btn green" onclick="ask('Full market analysis')">Market Analysis</button>
    <button class="skill-btn green" onclick="ask('Show me trade performance stats')">Performance</button>
    <button class="skill-btn blue" onclick="ask('Send WhatsApp: Gold Sniper alert test from Vercel agent')">Send WhatsApp</button>
    <button class="skill-btn blue" onclick="ask('Remember: Vercel AI agent deployed with auth')">Save Memory</button>
  </div>

  <div class="messages" id="messages">
    <div class="msg agent">Hey Shubham! I'm your Gold Sniper AI agent — secured with your access token. I have 10 skills ready. Ask me about prices, trades, patterns, or send WhatsApp alerts.</div>
  </div>

  <div class="stream-toggle">
    <input type="checkbox" id="streamToggle" checked> Stream responses (faster)
  </div>

  <div class="input-area">
    <input type="text" id="input" placeholder="Ask about gold prices, trades, patterns, or send WhatsApp..." onkeydown="if(event.key==='Enter')send()">
    <button id="sendBtn" onclick="send()">Send</button>
  </div>
</div>

<script>
const API = window.location.origin + '/api/chat';
let authToken = sessionStorage.getItem('gs_agent_token') || '';
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const streamToggle = document.getElementById('streamToggle');
const loginScreen = document.getElementById('loginScreen');
const chatScreen = document.getElementById('chatScreen');
const authInput = document.getElementById('authInput');
const loginError = document.getElementById('loginError');
let history = [];
let sending = false;

// Check if already authed
if (authToken) showChat();

function doLogin() {
  const token = authInput.value.trim();
  if (!token) { loginError.textContent = 'Please enter your access token'; return; }
  // Test auth by making a simple request
  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Auth-Token': token },
    body: JSON.stringify({ message: 'test', history: [] }),
  }).then(res => {
    if (res.status === 401) {
      loginError.textContent = 'Invalid token — try again';
      authInput.value = '';
    } else if (res.ok) {
      authToken = token;
      sessionStorage.setItem('gs_agent_token', token);
      loginError.textContent = '';
      showChat();
    } else {
      loginError.textContent = 'Server error — try again';
    }
  }).catch(() => {
    loginError.textContent = 'Connection error';
  });
}

function showChat() {
  loginScreen.style.display = 'none';
  chatScreen.classList.add('active');
  inputEl.focus();
}

function doLogout() {
  sessionStorage.removeItem('gs_agent_token');
  authToken = '';
  location.reload();
}

function addMsg(text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.innerHTML = text.replace(/\n/g, '<br>');
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'typing'; div.id = 'typing';
  div.textContent = 'Agent is thinking...';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function ask(q) { inputEl.value = q; send(); }

async function send(msg) {
  if (sending) return;
  const message = msg || inputEl.value.trim();
  if (!message) return;
  sending = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  addMsg(message, 'user');
  history.push({ role: 'user', content: message });
  const useStream = streamToggle.checked;

  if (useStream) {
    addTyping();
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Auth-Token': authToken },
        body: JSON.stringify({ message, history: history.slice(-10), stream: true }),
      });
      if (res.status === 401) { removeTyping(); doLogout(); return; }
      if (!res.ok) { removeTyping(); const err = await res.json(); addMsg('Error: ' + (err.details || err.error), 'system'); return; }
      removeTyping();
      const msgDiv = addMsg('', 'agent');
      let fullText = '';
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const data = line.slice(6).trim();
            if (data === '[DONE]') break;
            try {
              const parsed = JSON.parse(data);
              if (parsed.content) {
                fullText += parsed.content;
                msgDiv.innerHTML = fullText.replace(/\n/g, '<br>');
                messagesEl.scrollTop = messagesEl.scrollHeight;
              }
            } catch {}
          }
        }
      }
      history.push({ role: 'assistant', content: fullText });
    } catch (err) { removeTyping(); addMsg('Stream error: ' + err.message, 'system'); }
  } else {
    addTyping();
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Auth-Token': authToken },
        body: JSON.stringify({ message, history: history.slice(-10) }),
      });
      const data = await res.json();
      removeTyping();
      if (res.status === 401) { doLogout(); return; }
      if (data.error) { addMsg('Error: ' + (data.details || data.error), 'system'); }
      else {
        addMsg(data.reply, 'agent');
        history.push({ role: 'assistant', content: data.reply });
        if (data.skills) {
          if (data.skills.whatsapp) addMsg(data.skills.whatsapp.success ? 'WhatsApp sent' : 'WhatsApp failed: ' + data.skills.whatsapp.error, 'skill');
          if (data.skills.memory) addMsg(data.skills.memory.success ? 'Memory saved to Supabase' : 'Memory failed: ' + data.skills.memory.error, 'skill');
        }
      }
    } catch (err) { removeTyping(); addMsg('Error: ' + err.message, 'system'); }
  }
  sending = false;
  sendBtn.disabled = false;
  inputEl.focus();
}
</script>
</body>
</html>
