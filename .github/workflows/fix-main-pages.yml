name: Fix GitHub Pages dashboard spot feed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect Pages dashboard to Supabase dashboard-data
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Gold (GC=F) — Live Price','Gold (XAU/USD SPOT) — Live Price')
          s=s.replace("const API = 'https://schegpkwfwkgfmmpnzic.supabase.co/functions/v1/get-live-price';","const API = 'https://schegpkwfwkgfmmpnzic.supabase.co/functions/v1/dashboard-data';")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-main-pages.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix GitHub Pages XAU/USD spot dashboard'
          git push
