name: Connect Gold Sniper to Supabase

on:
  push:
    branches: [Goldsniper]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Base44 live and alert endpoints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dashboard/gold_sniper.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'https://base44.app/api/apps/6a59ebfbbec4437165873f86/functions/getLivePrice': 'https://schegpkwfwkgfmmpnzic.supabase.co/functions/v1/get-live-price',
            'https://lyra-65873f86.base44.app/functions/sendEntryAlert': 'https://schegpkwfwkgfmmpnzic.supabase.co/functions/v1/send-entry-alert',
          }
          old = s
          for a,b in replacements.items():
            s = s.replace(a,b)
          if s != old:
            p.write_text(s, encoding='utf-8')
            print('Supabase endpoints connected.')
          else:
            print('No endpoint changes needed.')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/gold_sniper.html
          git diff --cached --quiet && exit 0
          git commit -m 'Connect Gold Sniper dashboard to Supabase'
          git push
